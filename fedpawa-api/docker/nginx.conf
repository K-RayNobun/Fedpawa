# nginx frontal Fedpawa — port 8000 du conteneur, document root /app/public,
# PHP passe a php-fpm sur 127.0.0.1:9000 (socket TCP intra-conteneur).
#
# DETTE DOCUMENTEE : `user root;` car /root (monte en /app) est en 700 sur l'hote :
# des workers www-data ne pourraient pas traverser /app. Aligne sur le pool fpm
# en root (chantier permissions separe).

user root;
worker_processes 1;
pid /run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time upstream=$upstream_addr upstream_rt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Televersements KYC jusqu'a 10 Mo -> 12 Mo (consigne), sinon 413 propre de nginx
    client_max_body_size 220m;
    client_body_buffer_size 128k;
    client_body_timeout 120s;

    gzip on;
    gzip_types application/json application/javascript text/css application/pdf;

    server {
        listen 8000;
        server_name _;

        root /app/public;
        index index.php index.html;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 32k;
            fastcgi_busy_buffers_size 64k;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
