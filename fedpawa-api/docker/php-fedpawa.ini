; PHP (fpm + cli) — surcouche Fedpawa.
; Televersements KYC jusqu'a 10 Mo : limites >= 12 Mo (consigne).
; La chaine de signature (dompdf + scelleur python pyhanko) peut depasser 60 s.

upload_max_filesize = 210M
post_max_size = 220M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
default_socket_timeout = 300

; OPcache actif et regle (l'app est montee en volume : on garde la revalidation
; des timestamps pour eviter de servir du code stale apres un deploiement).
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.jit_buffer_size = 64M
opcache.jit = 1255
