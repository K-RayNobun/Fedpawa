; Pool php-fpm Fedpawa — écoute sur socket TCP 127.0.0.1:9000 (dans le conteneur).
;
; DETTE DOCUMENTEE : le pool tourne en root (user=root/group=root) pour préserver
; le comportement historique (`php artisan serve` en root) : l'app ecrit dans
; storage/, la base SQLite et lit les cles privees du scelleur (chmod 600 root).
; Le passage a un utilisateur dedie (www-data + droits ajustes sur storage/, la
; base et la PKI montee ro) est un chantier de permissions separe.
;
; Dimensionnement : hote 2 vCPU / 7 Go RAM (~4 Go deja utilises) -> pm.max_children=8
; (~8 processus php-fpm x ~50-80 Mo = ~0.5 Go worst case), pm=dynamic.

[fedpawa]
user = root
group = root
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
pm.status_path = /fpm-status

; L'app lit sa config dans .env, mais on garde l'environnement du conteneur
; (PATH pour proc_open du scelleur python, etc.)
clear_env = no
catch_workers_output = yes

; Limites de televersement alignees sur la consigne (KYC jusqu'a 10 Mo -> >= 12 Mo)
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 16M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[memory_limit] = 256M
php_admin_value[realpath_cache_size] = 4096k
php_admin_value[realpath_cache_ttl] = 600
