<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne — FEDPAWA</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #05080F; color: #E2E8F0;
      font-family: "Open Sans", "Segoe UI", Arial, sans-serif; text-align: center; padding: 24px;
    }
    .card { max-width: 420px; }
    .logo { width: 72px; height: 72px; border-radius: 10px; margin: 0 auto 20px; }
    h1 { font-size: 1.45rem; color: #D4AF37; margin: 0 0 10px; }
    p { line-height: 1.6; color: #94A3B8; margin: 0 0 24px; }
    button {
      background: #D4AF37; color: #0A1424; border: none; padding: 12px 28px;
      border-radius: 24px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icons/icon-192x192.png" alt="FEDPAWA" />
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de charger cette page sans connexion. Vérifiez votre réseau puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
